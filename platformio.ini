; FoundryVTT HP Monitor - Wemos D1 Mini (ESP8266) + round GC9A01 240x240 SPI LCD
;
; Pin numbers below must match include/config.h. TFT_MOSI/TFT_SCLK are not
; arbitrary - on ESP8266 hardware SPI only runs on GPIO13/GPIO14, so those
; two must stay put even if you change everything else.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600 ; the D1 Mini's CH340/CP2102 bridge chip handles this fine; drop to 115200 if uploads are unreliable

board_build.filesystem = littlefs

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	tzapu/WiFiManager @ ^2.0.17
	bblanchon/ArduinoJson @ ^7.0.0

extra_scripts = pre:tools/patch_glcdfont.py

build_flags =
	; ---- TFT_eSPI display driver selection & pin mapping ----
	; These configure TFT_eSPI entirely via build flags so you don't need
	; to hand-edit the library's User_Setup.h. Keep in sync with config.h.
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MISO=-1        ; unused (GC9A01 is write-only here); frees GPIO12 for TFT_DC below
	-D TFT_MOSI=13         ; D7 - fixed ESP8266 hardware SPI pin
	-D TFT_SCLK=14         ; D5 - fixed ESP8266 hardware SPI pin
	-D TFT_CS=15           ; D8
	-D TFT_DC=12           ; D6
	-D TFT_RST=16          ; D0
	-D SPI_FREQUENCY=20000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1

; Wireless upload. Flash the firmware over USB once (env:d1_mini), then on
; the device open Settings -> Firmware Update, and either:
;   - browse to the address shown on the screen (http://<ip>/update) and pick
;     the .pio/build/d1_mini/firmware.bin file, or
;   - run: pio run -e d1_mini_ota -t upload
; (the PlatformIO route needs your PC's firewall to allow incoming
; connections from the board; the browser route doesn't.)


;[env:d1_mini_ota]
;extends = env:d1_mini
;upload_protocol = espota
;upload_port = foundry-controller.local ; or the IP shown on the OTA screen
;; upload_flags = --auth=changeme       ; if you enable ArduinoOTA.setPassword() in main.cpp