<div id="glyph-editor-root"></div>
<style>
  #glyph-editor-root {
    --bg: #0b0f0d;
    --panel: #101613;
    --grid-off: #16211c;
    --grid-off-hover: #1d2b24;
    --grid-on: #6dffb0;
    --grid-on-glow: rgba(109, 255, 176, 0.35);
    --ink: #d8fbe8;
    --ink-dim: #6f8c7c;
    --accent: #6dffb0;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    padding: 28px 20px 36px;
    border-radius: 14px;
    max-width: 640px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #glyph-editor-root * { box-sizing: border-box; }

  .ge-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ge-title {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  .ge-sub {
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0 0 22px;
  }

  .ge-layout {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .ge-grid-wrap { flex: 0 0 auto; }

  .ge-grid {
    display: grid;
    grid-template-columns: repeat(5, 42px);
    grid-template-rows: repeat(7, 42px);
    gap: 3px;
    background: #000;
    padding: 3px;
    border-radius: 6px;
    border: 1px solid #1e2a24;
  }
  .ge-cell {
    width: 42px;
    height: 42px;
    background: var(--grid-off);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    transition: background 0.06s ease;
  }
  .ge-cell:hover { background: var(--grid-off-hover); }
  .ge-cell.on {
    background: var(--grid-on);
    box-shadow: 0 0 10px var(--grid-on-glow);
  }
  .ge-cell.on:hover { background: var(--grid-on); opacity: 0.85; }

  .ge-grid-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 3px;
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-dim);
  }

  .ge-preview-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .ge-preview-label {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .ge-preview {
    display: grid;
    grid-template-columns: repeat(5, 6px);
    grid-template-rows: repeat(7, 6px);
    gap: 1px;
    background: #000;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #1e2a24;
  }
  .ge-preview div { width: 6px; height: 6px; background: var(--grid-off); }
  .ge-preview div.on { background: var(--grid-on); }

  .ge-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .ge-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    background: transparent;
    color: var(--ink);
    border: 1px solid #2a3a32;
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .ge-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ge-btn.primary { border-color: var(--accent); color: var(--accent); }

  .ge-output-section {
    margin-top: 24px;
    border-top: 1px solid #1e2a24;
    padding-top: 18px;
  }
  .ge-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .ge-row label {
    font-size: 11px;
    color: var(--ink-dim);
    min-width: 70px;
  }
  .ge-row input[type="text"] {
    font-family: var(--mono);
    background: #000;
    border: 1px solid #2a3a32;
    color: var(--ink);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
  }
  #ge-code { width: 70px; }
  #ge-name { flex: 1; min-width: 120px; }

  .ge-output {
    background: #000;
    border: 1px solid #2a3a32;
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--accent);
    white-space: pre-wrap;
    word-break: break-all;
    position: relative;
  }
  .ge-copy {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
  }
  .ge-import {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .ge-import input[type="text"] {
    flex: 1;
    min-width: 180px;
    font-family: var(--mono);
    background: #000;
    border: 1px solid #2a3a32;
    color: var(--ink);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
  }
</style>
<script>
(function () {
  const root = document.getElementById('glyph-editor-root');

  root.innerHTML += `
    <div class="ge-header">
      <p class="ge-title">Glyph Editor</p>
      <p class="ge-sub">5&times;7 GLCD font tool</p>
    </div>
    <p class="ge-sub" style="margin-top:-14px;">Click cells to draw. Output pastes straight into patch_glcdfont.py's GLYPHS dict.</p>

    <div class="ge-layout">
      <div class="ge-grid-wrap">
        <div class="ge-grid" id="ge-grid"></div>
        <div class="ge-grid-labels"><span>col 0</span><span>col 4</span></div>
      </div>
      <div class="ge-preview-wrap">
        <span class="ge-preview-label">Actual size</span>
        <div class="ge-preview" id="ge-preview"></div>
      </div>
    </div>

    <div class="ge-actions">
      <button class="ge-btn" id="ge-clear">Clear</button>
      <button class="ge-btn" id="ge-invert">Invert</button>
      <button class="ge-btn" id="ge-flip-h">Flip ↔</button>
      <button class="ge-btn" id="ge-flip-v">Flip ↕</button>
    </div>

    <div class="ge-output-section">
      <div class="ge-row">
        <label for="ge-code">Code (hex)</label>
        <input type="text" id="ge-code" value="0x60" spellcheck="false">
        <label for="ge-name" style="min-width:auto;">Name</label>
        <input type="text" id="ge-name" value="BUTTON_A_LABEL: X" spellcheck="false">
      </div>
      <div class="ge-output" id="ge-output">
        <button class="ge-btn ge-copy" id="ge-copy">Copy</button>
      </div>

      <div class="ge-import">
        <input type="text" id="ge-import-input" placeholder="Paste existing bytes to load, e.g. 0x63, 0x14, 0x08, 0x14, 0x63" spellcheck="false">
        <button class="ge-btn" id="ge-import-btn">Load</button>
      </div>
    </div>
  `;

  const ROWS = 7, COLS = 5;
  // grid[col][row] = 0 or 1
  let grid = Array.from({ length: COLS }, () => Array(ROWS).fill(0));

  const gridEl = root.querySelector('#ge-grid');
  const previewEl = root.querySelector('#ge-preview');
  const cells = [];
  const previewCells = [];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('button');
      cell.className = 'ge-cell';
      cell.type = 'button';
      cell.addEventListener('click', () => {
        grid[c][r] = grid[c][r] ? 0 : 1;
        render();
      });
      gridEl.appendChild(cell);
      cells.push({ el: cell, c, r });

      const pc = document.createElement('div');
      previewEl.appendChild(pc);
      previewCells.push({ el: pc, c, r });
    }
  }

  function bytesFromGrid() {
    const bytes = [];
    for (let c = 0; c < COLS; c++) {
      let b = 0;
      for (let r = 0; r < ROWS; r++) {
        if (grid[c][r]) b |= (1 << r);
      }
      bytes.push(b);
    }
    return bytes;
  }

  function render() {
    cells.forEach(({ el, c, r }) => el.classList.toggle('on', !!grid[c][r]));
    previewCells.forEach(({ el, c, r }) => el.classList.toggle('on', !!grid[c][r]));

    const bytes = bytesFromGrid();
    const hex = bytes.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0'));
    const code = (root.querySelector('#ge-code').value || '0x00').trim();
    const name = (root.querySelector('#ge-name').value || '').trim();

    const outEl = root.querySelector('#ge-output');
    const line = `    ${code}: [${hex.join(', ')}],` + (name ? `  # ${name}` : '');
    outEl.innerHTML = `<button class="ge-btn ge-copy" id="ge-copy">Copy</button>` + line;

    root.querySelector('#ge-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(line.trim());
      const btn = root.querySelector('#ge-copy');
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1000);
    });
  }

  root.querySelector('#ge-clear').addEventListener('click', () => {
    grid = Array.from({ length: COLS }, () => Array(ROWS).fill(0));
    render();
  });
  root.querySelector('#ge-invert').addEventListener('click', () => {
    grid = grid.map(col => col.map(v => v ? 0 : 1));
    render();
  });
  root.querySelector('#ge-flip-h').addEventListener('click', () => {
    grid = grid.slice().reverse();
    render();
  });
  root.querySelector('#ge-flip-v').addEventListener('click', () => {
    grid = grid.map(col => col.slice().reverse());
    render();
  });
  root.querySelector('#ge-code').addEventListener('input', render);
  root.querySelector('#ge-name').addEventListener('input', render);

  root.querySelector('#ge-import-btn').addEventListener('click', () => {
    const raw = root.querySelector('#ge-import-input').value;
    const matches = raw.match(/0x[0-9A-Fa-f]{2}/g);
    if (!matches || matches.length < 5) {
      alert('Need 5 byte values, e.g. 0x63, 0x14, 0x08, 0x14, 0x63');
      return;
    }
    const bytes = matches.slice(0, 5).map(h => parseInt(h, 16));
    grid = bytes.map(b => {
      const col = Array(ROWS).fill(0);
      for (let r = 0; r < ROWS; r++) col[r] = (b >> r) & 1;
      return col;
    });
    render();
  });

  render();
})();
</script>
